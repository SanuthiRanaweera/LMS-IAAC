services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lms-backend
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: https://iaaccampus.com
    restart: always
    expose:
      - "5000"
    volumes:
      - backend_uploads:/app/server/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: lms-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  backend_uploads:
