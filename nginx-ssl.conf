upstream lms_api {
    server backend:5000;
    keepalive 32;
}

# ============================================================
# HTTP -> HTTPS
# ============================================================

server {
    listen 80;
    server_name iaaccampus.com www.iaaccampus.com;

    return 301 https://$host$request_uri;
}

# ============================================================
# HTTPS
# ============================================================

server {
    listen 443 ssl;
    server_name iaaccampus.com www.iaaccampus.com;

    # --------------------------------------------------------
    # SSL
    # --------------------------------------------------------

    ssl_certificate /etc/letsencrypt/live/iaaccampus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iaaccampus.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --------------------------------------------------------
    # UPLOAD SIZE
    # --------------------------------------------------------

    # Allows large Knowledge Hub / material uploads
    client_max_body_size 200M;

    # Helpful for larger uploads
    client_body_timeout 120s;

    # --------------------------------------------------------
    # FRONTEND
    # --------------------------------------------------------

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------
    # FRONTEND STATIC ASSETS
    # --------------------------------------------------------

    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------------
    # API
    # --------------------------------------------------------

    location /api/ {
        proxy_pass http://lms_api;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_request_buffering on;
    }

    # --------------------------------------------------------
    # UPLOADED FILES
    # --------------------------------------------------------

    

    location /uploads/ {
        proxy_pass http://lms_api;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Don't aggressively cache uploaded images while debugging
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        expires off;
    }

    # --------------------------------------------------------
    # REACT SPA
    # --------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}